<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Figurinhos</title>
  <meta name="description" content="Manager de futebol de botão: monte seu álbum, escale o time e brigue pelo título do Brasileirão.">
  <meta name="theme-color" content="#1B1F2A">
  <script>try { document.documentElement.dataset.tema = localStorage.getItem('fig.tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'); } catch (e) { }</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Jersey+10&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header id="topo" hidden></header>
  <main id="tela" tabindex="-1"><p class="carregando">Abrindo o álbum…</p></main>
  <nav id="abas" hidden aria-label="Seções do jogo"></nav>
  <dialog id="ficha" aria-label="Ficha do jogador"></dialog>
  <div id="aviso" role="status" aria-live="polite"></div>
</body>
</html>
